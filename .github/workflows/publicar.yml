name: Publicar versión

on:
  workflow_dispatch:
    inputs:
      publicar:
        description: "Publicar como versión nueva en Releases. Sin tildar, sólo arma la app y la deja en esta corrida."
        type: boolean
        default: false
      obligatoria:
        description: "Obligatoria: las versiones anteriores dejan de funcionar cuando pasan los días de gracia."
        type: boolean
        default: false
      dias_gracia:
        description: "Días de gracia (sólo si es obligatoria)."
        type: number
        default: 7
      mensaje:
        description: "Qué trae la versión nueva (se muestra en el aviso de la app). Opcional."
        type: string
        default: ""
  pull_request:
    paths:
      - ".github/workflows/publicar.yml"
      - "armar_app.command"
      - "armar_app_windows.ps1"
      - "kramer_ventana.py"
      - "kramer_arranque.py"

permissions:
  contents: read

concurrency:
  group: publicar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.leer.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: leer
        name: Leer la versión de web/version.txt
        run: echo "version=$(tr -d '[:space:]' < web/version.txt)" >> "$GITHUB_OUTPUT"
      - name: Frenar si esa versión ya está publicada
        if: github.event_name == 'workflow_dispatch' && inputs.publicar
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.leer.outputs.version }}
        run: |
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::La versión $VERSION ya está publicada. Subí el número en web/version.txt y volvé a correr."
            exit 1
          fi
      - name: Frenar si falta la clave de las actualizaciones
        if: github.event_name == 'workflow_dispatch' && inputs.publicar
        env:
          CLAVE: ${{ secrets.ACTUALIZACION_CLAVE_PRIVADA }}
        run: |
          if [ -z "$CLAVE" ]; then
            echo "::error::Falta el secreto ACTUALIZACION_CLAVE_PRIVADA (Settings → Secrets and variables → Actions)."
            exit 1
          fi

  mac:
    needs: version
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Armar la app para Mac
        env:
          KRAMER_SALIDA: ${{ runner.temp }}/salida
        run: ./armar_app.command
      - name: Poner el nombre de descarga
        run: mv "$RUNNER_TEMP/salida/RKB Collection Manager (Mac).zip" "$RUNNER_TEMP/RKB-Collection-Manager-Mac.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: mac
          path: ${{ runner.temp }}/RKB-Collection-Manager-Mac.zip
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - name: Armar la app para Windows
        shell: powershell
        env:
          KRAMER_SALIDA: ${{ runner.temp }}\salida
        run: powershell -NoProfile -ExecutionPolicy Bypass -File armar_app_windows.ps1
      - name: Poner el nombre de descarga
        shell: powershell
        run: Move-Item "$env:RUNNER_TEMP\salida\RKB Collection Manager (Windows).zip" "$env:RUNNER_TEMP\RKB-Collection-Manager-Windows.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: ${{ runner.temp }}\RKB-Collection-Manager-Windows.zip
          if-no-files-found: error

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.publicar
    needs: [version, mac, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/salida
          merge-multiple: true
      - name: Firmar la actualización automática
        env:
          CLAVE: ${{ secrets.ACTUALIZACION_CLAVE_PRIVADA }}
        run: |
          python3 -m pip install --quiet pynacl
          umask 077
          printf '%s\n' "$CLAVE" > "$RUNNER_TEMP/clave.txt"
          python3 publicar_actualizacion.py armar --clave-privada "$RUNNER_TEMP/clave.txt" --salida "$RUNNER_TEMP/paquete"
          rm -f "$RUNNER_TEMP/clave.txt"
      - name: Crear la versión en Releases
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            "$RUNNER_TEMP/salida/RKB-Collection-Manager-Mac.zip" "$RUNNER_TEMP/salida/RKB-Collection-Manager-Windows.zip" \
            "$RUNNER_TEMP/paquete/codigo-$VERSION.zip" "$RUNNER_TEMP/paquete/manifiesto.json" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "RKB Collection Manager $VERSION" --generate-notes
      - name: Avisar a las apps instaladas (control/versiones.json)
        env:
          VERSION: ${{ needs.version.outputs.version }}
          OBLIGATORIA: ${{ inputs.obligatoria }}
          DIAS: ${{ inputs.dias_gracia }}
          MENSAJE: ${{ inputs.mensaje }}
        run: |
          git fetch --depth=1 origin main
          git checkout -B main origin/main
          extra=()
          if [ "$OBLIGATORIA" = "true" ]; then extra+=(--obligatoria --dias "$DIAS"); fi
          python3 control/control.py publicada "$VERSION" --mensaje "$MENSAJE" "${extra[@]}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add control/versiones.json
          git diff --cached --quiet || git commit -m "Versión $VERSION publicada"
          git push origin main
