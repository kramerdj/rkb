# Pruebas automáticas en cada cambio (push a main y pull requests).
# El armado y la publicación de versiones están en publicar.yml.
name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    strategy:
      fail-fast: false
      matrix:
        sistema: [macos-15, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.sistema }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Librerías
        run: python -m pip install -q -r requirements.txt
      - name: Pruebas (sin Rekordbox ni música)
        run: python -m unittest discover -s tests -v
      - name: Revisar la interfaz (JavaScript)
        shell: bash
        run: for f in web/*.js; do node --check "$f"; done
