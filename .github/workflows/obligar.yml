name: Versión obligatoria

# Para obligar a actualizar (o dejar de obligar) sin publicar una versión nueva.
on:
  workflow_dispatch:
    inputs:
      accion:
        description: "obligar = las versiones anteriores dejan de funcionar al terminar la gracia · liberar = no obliga a nadie"
        type: choice
        options: [obligar, liberar]
        default: obligar
      version:
        description: "Versión mínima que se exige (por ejemplo 0.9.2). Vacío = la última publicada."
        type: string
        default: ""
      dias_gracia:
        description: "Días de aviso antes de bloquear."
        type: number
        default: 7
      mensaje:
        description: "Mensaje para los usuarios (opcional)."
        type: string
        default: ""

permissions:
  contents: write

jobs:
  cambiar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Cambiar control/versiones.json
        env:
          ACCION: ${{ inputs.accion }}
          VERSION: ${{ inputs.version }}
          DIAS: ${{ inputs.dias_gracia }}
          MENSAJE: ${{ inputs.mensaje }}
        run: |
          if [ "$ACCION" = "liberar" ]; then
            python3 control/control.py liberar --mensaje "$MENSAJE"
          else
            if [ -z "$VERSION" ]; then VERSION=$(python3 -c "import json;print(json.load(open('control/versiones.json'))['ultima'])"); fi
            python3 control/control.py obligar "$VERSION" --dias "$DIAS" --mensaje "$MENSAJE"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add control/versiones.json
          git diff --cached --quiet || git commit -m "Control de versiones: $ACCION $VERSION"
          git push origin HEAD:main
